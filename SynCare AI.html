<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SynCare AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f3f8fb;--card:#fff;--ink:#0d2b5e;--mut:#5b6f8f;--pri:#0a4fa8;--acc:#13b5b1;--ok:#1d9e6a;--warn:#d98a00;--bad:#c62f3a;--bd:#d6e3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1a2b;--card:#12263d;--ink:#e6f0fa;--mut:#9db3cc;--pri:#5aa4ff;--acc:#2fd0cb;--bd:#27415e}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,"Noto Sans Tamil","Noto Sans Devanagari","Noto Sans Malayalam",sans-serif}
body.big{font-size:21px}body.big button{padding:16px 20px}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
.logo{background:#fff;border-radius:10px;padding:2px 8px}.logo img{height:54px;display:block}.sp{flex:1}
select,input,button{font:inherit;color:inherit}
select,input{padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);width:100%}
header select{width:auto}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600}
button.s{background:transparent;color:var(--pri);border:1px solid var(--pri)}button.r{background:var(--bad)}button.g{background:var(--ok)}
button:focus-visible,input:focus-visible,select:focus-visible,.rm:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:1150px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.login{max-width:430px;margin:30px auto}.lg{display:block;margin:6px auto 10px;width:min(380px,90%);border-radius:10px;background:#fff}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:.9em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--bd)}.tabs button.on{background:var(--pri);color:#fff}
.step{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
.step.now{border:2px solid var(--bad)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}.done{background:var(--ok)}.pend{background:var(--warn)}.lock{background:var(--mut)}.now{background:var(--bad)}
.pill{padding:2px 10px;border-radius:99px;font-size:.8em;background:var(--bg);border:1px solid var(--bd);white-space:nowrap}
.pill.sa{background:var(--ok);color:#fff;border:0}.pill.sb,.pill.sd{background:var(--warn);color:#1b1300;border:0}.pill.sbr{background:#6b5bd6;color:#fff;border:0}.pill.sn{background:var(--bad);color:#fff;border:0}.pill.sf{background:var(--mut);color:#fff;border:0}
.ai{border:2px solid var(--acc)}.ai .say{font-size:1.1em;margin:8px 0}
.msg{background:var(--bg);padding:8px 10px;border-radius:8px;margin:6px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.map{border:1px solid var(--bd);border-radius:10px;background:var(--card);overflow:hidden}.map svg{width:100%;height:auto;display:block}.rm{cursor:pointer}
.alert{background:var(--bad);color:#fff;padding:12px;border-radius:10px;margin-bottom:12px}
.hide{display:none}.note{color:var(--mut);font-size:.85em}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.dc{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--bd);border-radius:12px;padding:16px;font-weight:400}.dc:hover{border-color:var(--pri)}.dc .ic{font-size:2em}
.dd{border:1px solid var(--bd);border-radius:12px;padding:14px;background:var(--card)}.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
</style></head><body>

<div class="card"><h3 data-t="dir" style="margin-top:0"></h3><div id="sum" class="note"></div><div id="cur" style="font-size:1.2em;margin:10px 0"></div><div class="row"><button class="s" id="pv" data-t="prev"></button><button id="nx" data-t="next"></button><button class="s" id="vs" data-t="spk"></button></div><p class="note" data-t="noqr"></p></div></div></div>

<div id="t_q" class="hide"><div class="card"><h3 data-t="queue" style="margin-top:0"></h3><div style="overflow-x:auto"><table id="qt"></table></div><p><button class="s" id="sim" data-t="sim"></button></p><svg id="ch" viewBox="0 0 560 120" style="width:100%"></svg></div>

function path(a,b,wc,em){const rv=em?null:resv(),d={[a]:0},p={},v=new Set();for(;;){let u=null;for(const k in d)if(!v.has(k)&&(u===null||d[k]<d[u]))u=k;if(u===null||u===b)break;v.add(u);for(const[n,w,s]of G[u]||[]){if(wc&&s)continue;if(em&&n[0]==='A')continue;if(rv&&rv.has(n)&&n!==b)continue;if(closed[n]&&n!==b)continue;const nd=d[u]+w;if(d[n]===undefined||nd<d[n]){d[n]=nd;p[n]=u}}}if(d[b]===undefined)return null;const r=[b];while(r[0]!==a)r.unshift(p[r[0]]);return{p:r,c:d[b]}}
function dirs(p){const o=[];let acc=0,face=0,fl=nf(p[0]);const flush=()=>{if(acc){o.push({t:t(face>0?'ri':'le',{m:acc}),f:fl});acc=0}};
 for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],ac='CA'.includes(a[0]),bc='CA'.includes(b[0]),al='LS'.includes(a[0]),bl='LS'.includes(b[0]);
  if(ac&&bc){face=+b.split('_')[1]>+a.split('_')[1]?1:-1;acc+=12;continue}flush();
  if(!ac&&!al&&bc)o.push({t:t('st',{m:10}),f:fl});
  else if(ac&&bl)o.push({t:t('st',{m:8}),f:fl});
  else if(al&&bl){fl=+b[1];o.push({t:t(a[0]==='L'?'li':'sta',{f:fn(fl)}),f:fl})}
  else if(ac&&!bl){o.push({t:t(face===0?'st':((face>0)===(R[b].row===0)?'le':'ri'),{m:10}),f:fl})}}
 flush();o.push({t:t('ar',{p:nm(R[p[p.length-1]])}),f:fl});return o}
